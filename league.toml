# League settings for the virtual GM.
#
# `fgm sync` reads categories, roster slots, roster limits, team count and
# season from Fantrax and those values override this file. What remains
# here is what Fantrax doesn't report.

[league]
name = "Langley/Denison Dynasty"
fantrax_league_id = "fyizf75fmv8807pz"
teams = 16
season = 2027                 # projection season
my_team_id = "uv5e6w1dmv8807ww"   # Dallas Diesel Drinkers

[categories]
# Overridden by Fantrax on sync. Current league scoring (5x5 H2H):
hitting = ["R", "HR", "RBI", "SB", "OBP"]
pitching = ["ERA", "W", "SVH", "WHIP", "K"]
inverse = ["ERA", "WHIP"]

[roster]
# Overridden by Fantrax on sync (19 active / 14 reserve / 48 total).
slots = { C = 1, "1B" = 1, "2B" = 1, "3B" = 1, SS = 1, INF = 1, OF = 3, UT = 2, SP = 3, RP = 2, P = 3 }
bench = 14
minors = 15
injured_reserve = 3           # TODO: not reported by Fantrax

[minors_eligibility]
# A player keeps minor-league eligibility while at or under these MLB career
# totals. TODO: replace with the league's actual rule.
max_career_ab = 130
max_career_ip = 50
warn_fraction = 0.8           # flag players who have used 80% of the limit

[dynasty]
horizon_years = 5
# Per-year discount by team mode: how much next year matters relative to now.
discount = { contending = 0.65, balanced = 0.80, rebuilding = 0.92 }
# Current-season weight multiplier by mode (rebuilders care less about now).
year0_weight = { contending = 1.25, balanced = 1.0, rebuilding = 0.6 }
rookie_draft_rounds = 3

[team_modes]
# Override the automatic contending/balanced/rebuilding call per team, e.g.
# "abc123xyz" = "rebuilding"
