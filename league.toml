# League settings for the virtual GM.
# Values marked TODO are guesses -- `fgm sync` overwrites roster slots from
# Fantrax when the league info endpoint returns them; set the rest by hand.

[league]
name = "Dynasty League"
fantrax_league_id = "fyizf75fmv8807pz"
teams = 16
season = 2027                 # projection season
my_team_id = ""               # Fantrax team id; `fgm teams` lists them

[categories]
# H2H categories. Lower-is-better categories are listed in `inverse`.
hitting = ["HR", "AVG", "RBI", "SB"]
pitching = ["ERA", "W", "SVH", "WHIP", "K"]
inverse = ["ERA", "WHIP"]

[roster]
# Active lineup slots. TODO: confirm against Fantrax roster settings.
slots = { C = 1, "1B" = 1, "2B" = 1, "3B" = 1, SS = 1, OF = 3, UT = 1, SP = 5, RP = 3, P = 1 }
bench = 6                     # TODO
minors = 10                   # TODO
injured_reserve = 3           # TODO

[minors_eligibility]
# A player keeps minor-league eligibility while at or under these MLB career
# totals. TODO: replace with the league's actual rule.
max_career_ab = 130
max_career_ip = 50
warn_fraction = 0.8           # flag players who have used 80% of the limit

[dynasty]
horizon_years = 5
# Per-year discount by team mode: how much next year matters relative to now.
discount = { contending = 0.65, balanced = 0.80, rebuilding = 0.92 }
# Current-season weight multiplier by mode (rebuilders care less about now).
year0_weight = { contending = 1.25, balanced = 1.0, rebuilding = 0.6 }
rookie_draft_rounds = 4

[team_modes]
# Override the automatic contending/balanced/rebuilding call per team, e.g.
# "abc123xyz" = "rebuilding"
